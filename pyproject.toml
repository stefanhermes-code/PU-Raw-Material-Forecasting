[project]
name = "raw-material-forecasting"
version = "1.2.102"
description = "HTC Global polyurethane raw-material forecasting MVP"
requires-python = ">=3.12"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  # Floored and capped on 5 November 2026, after the forecast chart raised TypeError on
  # every draw under plotly 6.5.0 (see _build_forecast_figure in app.py). >=5.20 was a
  # fiction: nothing between 5.20 and 6.5 has ever been run here, and 7.0.0 changed the very
  # code path that broke, so a new major is a behaviour change rather than a patch. 6.5 is
  # the oldest version the chart has actually been measured on; 7.0.0 is what the launcher
  # installs. Not pinned exactly, because then no plotly security fix could ever arrive.
  "plotly>=6.5,<8",
  "streamlit>=1.40",
  "SQLAlchemy>=2.0",
  "requests>=2.31",
  "fastapi>=0.115",
  "uvicorn>=0.34",
  "pydantic>=2.10",
  "alembic>=1.14",
  "httpx>=0.27",
  "psycopg[binary]>=3.2",
  "playwright>=1.55",
  "openpyxl>=3.1",
  "truststore>=0.9",
  "pyflakes>=3.2",
  "pypinyin>=0.53",
  "tzdata>=2025.2",
]

[tool.pytest.ini_options]
pythonpath = ["src", "market_data_engine"]
testpaths = ["tests"]
markers = ["live: talks to the real ECHEMI site through a real Edge (Windows only); run with -m live"]
addopts = "-m 'not live'"
